[build-system]
requires = ["setuptools==75.2.0", "wheel", "twine"]
build-backend = "setuptools.build_meta"

[project]
name = "..." 
version = "0.0.0"
authors = [{name = "Christian Morland", email = "christian.morland@thuenen.de"}]
description = "Data importer for FAO forestry statistics, Global FOrest Recource Assessment, WDI and BACI data."
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
keywords = ["timba", "data", "forest sector", "thuenen institute", "economics of forests", "research"]

requires-python = ">=3.9,<3.12 "
dependencies = [
    "Pandas==1.5.3",
    "Numpy==1.26.0",
    "tqdm==4.67.1",
    "matplotlib==3.9.2",
    "pyarrow==18.0.0",
    "fastparquet==2024.11.0",
    "pathlib==1.0.1",
    "gme==1.3",
    "statsmodels==0.14.4",
    "scikit-learn==1.5.2",
    "keras==3.7.0",
    "tensorflow==2.18.0",
    "seaborn==0.13.2",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://github.com/TI-Forest-Sector-Modelling/TiMBA"
Documentation = "https://github.com/TI-Forest-Sector-Modelling/TiMBA/blob/main/documentation/documentation_TiMBA.pdf"
Repository = "https://github.com/TI-Forest-Sector-Modelling/TiMBA"
Issues = "https://github.com/TI-Forest-Sector-Modelling/TiMBA/issues"

[project.scripts]
download_data = "src.cli.cli:download"

[tool.setuptools]
license-files = ["COPYING"]
include-package-data = true
zip-safe = true

[tool.setuptools.packages]
find = {namespaces = false}

[tool.setuptools.package-data]
"*" = ["README.md", "COPYING", "COPYRIGHT", "CITATION.cff"]

[tool.coverage.report]
fail_under = 50
show_missing = true

[tool.coverage.run]
branch = true
include = ["TiMBA/*"]
command_line = "-m unittest discover -s test"
